---
sensor:
  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40104
    register_type: holding
    value_type: U_WORD
    name: "battery_bus_voltage"
    icon: mdi:lightning-bolt
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    lambda: "return x * id(mult_V);"
    filters:
      - or:
          - delta: 0.1
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: battery_power
