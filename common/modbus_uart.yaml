---
uart:
  id: modbus_uart
  tx_pin: ${GPIO_TX}
  rx_pin: ${GPIO_RX}
  baud_rate: ${UART_BAUD_RATE}
  data_bits: 8
  stop_bits: 1
  parity: NONE

# Modbus over RS485
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: ${GPIO_FC}
  role: client
  send_wait_time: ${MODBUS_SEND_DELAY}
