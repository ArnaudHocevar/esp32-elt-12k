---
uart:
  id: modbus_uart
  tx_pin: ${GPIO_TX}
  rx_pin: ${GPIO_RX}
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE

# Modbus over RS485
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: ${GPIO_FC}
  role: client
  send_wait_time: ${MODBUS_SEND_DELAY}
  turnaround_time: 200ms

select:
  - id: change_modbus_baud_rate
    name: modbus_uart_baud_rate_select
    platform: template
    options:
      - "2400"
      - "9600"
      - "19200"
      - "38400"
      - "57600"
      - "115200"
      - "256000"
      - "512000"
      - "921600"
    initial_option: "115200"
    optimistic: true
    restore_value: true
    internal: false
    entity_category: config
    icon: mdi:swap-horizontal
    set_action:
      - logger.log:
          tag: "modbus"
          level: DEBUG
          format: "Changing Modbus baud rate from %lx to %lx"
          args: ['id(modbus_uart).get_baud_rate()', 'stoi(x)']
      - lambda: |-
          id(modbus_uart).flush();
          uint32_t new_baud_rate = stoi(x);
          if (id(modbus_uart).get_baud_rate() != new_baud_rate) {
            id(modbus_uart).set_baud_rate(new_baud_rate);
            id(modbus_uart).load_settings();
          }
