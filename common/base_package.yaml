---
packages:
  - !include base_config.yaml
  - !include modbus_uart.yaml
  - !include wireless.yaml
  - !include modbus_controller.yaml
  - !include modbus_sensors_elt12k.yaml
  - !include webserver.yaml
  - !include worker.yaml

esphome:
  name: esp32-elt-12k
  friendly_name: ESP32 ELT-12K PCS controller
  includes:
    - include/device_string.h
    - src/device_string.cpp
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - lambda: |-
          auto info = esp32_elt12k::device_string::parse_device_string(id(sys_debug_info).state);
          if (info.valid) {
            id(sys_esphome_version).publish_state(info.esphome_version);
            id(sys_board_device).publish_state(info.board_device);
            id(sys_framework_version).publish_state(info.framework_version);
            if (info.cpu_freq > 0.0f) {
              id(sys_cpu_freq).publish_state(info.cpu_freq);
            }
          } else {
            ESP_LOGW("custom", "Device debug string structure mismatched or not ready yet.");
          }

# Enable logging
logger:
  level: INFO
  logs:
    modbus: WARN
    modbus_controller: WARN
    sensor: WARN

# Enable Home Assistant API
api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    password: ${ota_password}

debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    device:
      id: sys_debug_info
      internal: true
    reset_reason:
      name: "system_reset_reason"
      icon: mdi:information-outline
      web_server:
        sorting_group_id: device_info
  - platform: template
    name: "system_esphome_version"
    id: sys_esphome_version
    icon: "mdi:cube-outline"
    update_interval: never
    web_server:
      sorting_group_id: device_info
  - platform: template
    name: "system_board_device"
    id: sys_board_device
    icon: "mdi:cpu-64-bit"
    update_interval: never
    web_server:
      sorting_group_id: device_info
  - platform: template
    name: "system_framework_version"
    id: sys_framework_version
    icon: "mdi:code-braces"
    update_interval: never
    web_server:
      sorting_group_id: device_info

sensor:
  - platform: internal_temperature
    name: "system_cpu_temp"
    update_interval: 60s
    icon: mdi:thermometer
    unit_of_measurement: "C"
    web_server:
      sorting_group_id: device_info
  - platform: debug
    free:
      name: "system_free_heap"
      id: sys_mem_free
      icon: "mdi:memory"
      web_server:
        sorting_group_id: device_info
    min_free:
      name: "system_min_free_heap"
      icon: "mdi:memory"
      web_server:
        sorting_group_id: device_info
    fragmentation:
      name: "system_mem_fragmentation"
      unit_of_measurement: "%"
      icon: "mdi:memory"
      web_server:
        sorting_group_id: device_info
    loop_time:
      name: "system_max_loop_time"
      unit_of_measurement: "ms"
      icon: mdi:timer-sand
      web_server:
        sorting_group_id: device_info
  - platform: template
    name: "system_cpu_freq"
    id: sys_cpu_freq
    icon: "mdi:speedometer"
    unit_of_measurement: "MHz"
    state_class: "measurement"
    update_interval: never
    web_server:
      sorting_group_id: device_info
  - platform: template
    name: "system_mem_pct_used"
    id: mem_pct_used
    unit_of_measurement: "%"
    icon: "mdi:memory"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      static float initial_heap = 0.0f;
      static float inv_initial_heap = 0.0f;
      float current_free = id(sys_mem_free).state;
      if (initial_heap == 0.0f && current_free > 0.0f) {
        initial_heap = current_free;
        inv_initial_heap = 100.0f / initial_heap;
      }
      if (initial_heap > 0.0f) {
        return (initial_heap - current_free) * inv_initial_heap;
      }
      return 0.0f;
    web_server:
      sorting_group_id: device_info
