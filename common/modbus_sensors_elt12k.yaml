    lambda: "return x * id(mult_W);"
    filters:
      - or:
          - delta: 10.0
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: grid_power

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40140
    register_type: holding
    value_type: S_WORD
    name: "reactive_power_l3"
    icon: mdi:flash-outline
    unit_of_measurement: "Var"
    device_class: reactive_power
    lambda: "return x * id(mult_W);"
    filters:
      - or:
          - delta: 10.0
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: grid_power

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40146
    register_type: holding
    value_type: U_WORD
    name: "battery_charge_daily"
    icon: mdi:battery-arrow-up
    unit_of_measurement: "kWh"
    device_class: energy
    accuracy_decimals: 2
    lambda: "return x * id(mult_Energy);"
    filters:
      - or:
          - delta: 0.05
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: battery_power

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40147
    register_type: holding
    value_type: U_WORD
    name: "battery_discharge_daily"
    icon: mdi:battery-arrow-down
    unit_of_measurement: "kWh"
    device_class: energy
    accuracy_decimals: 2
    lambda: "return x * id(mult_Energy);"
    filters:
      - or:
          - delta: 0.05
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: battery_power

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40148
    register_type: holding
    value_type: U_WORD
    register_count: 2
    name: "battery_charge_total"
    icon: mdi:battery-arrow-up-outline
    unit_of_measurement: "kWh"
    device_class: energy
    accuracy_decimals: 2
    lambda: "return x * id(mult_Energy);"
    filters:
