    value_type: U_WORD
    register_count: 2
    name: "battery_discharge_total"
    icon: mdi:battery-arrow-down-outline
    unit_of_measurement: "kWh"
    device_class: energy
    accuracy_decimals: 2
    lambda: "return x * id(mult_Energy);"
    filters:
      - or:
          - delta: 0.05
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: battery_power

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40153
    register_type: holding
    value_type: S_WORD
    name: "grid_power_l1"
    icon: mdi:transmission-tower
    unit_of_measurement: "W"
    device_class: power
    lambda: "return x * id(mult_W);"
    filters:
      - or:
          - delta: 10.0
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: grid_power

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40154
    register_type: holding
    value_type: S_WORD
    name: "grid_power_l2"
    icon: mdi:transmission-tower
    unit_of_measurement: "W"
    device_class: power
    lambda: "return x * id(mult_W);"
    filters:
      - or:
          - delta: 10.0
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: grid_power

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40155
    register_type: holding
    value_type: S_WORD
    name: "grid_power_l3"
    icon: mdi:transmission-tower
    unit_of_measurement: "W"
    device_class: power
    lambda: "return x * id(mult_W);"
    filters:
      - or:
          - delta: 10.0
          - heartbeat: ${MODBUS_NO_VARIATION_HEARTBEAT}
    web_server:
      sorting_group_id: grid_power

  # --- Temperature Sensors ---
  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40156
    register_type: holding
    value_type: S_WORD
    name: "battery_temp"
    icon: mdi:thermometer
    unit_of_measurement: "C"
    device_class: temperature
    accuracy_decimals: 1
    force_new_range: true
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    lambda: "return x * id(mult_Temp);"
    web_server:
      sorting_group_id: sys_health

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40157
    register_type: holding
    value_type: S_WORD
    name: "system_temp"
    icon: mdi:thermometer
    unit_of_measurement: "C"
    device_class: temperature
    accuracy_decimals: 1
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    lambda: "return x * id(mult_Temp);"
    web_server:
      sorting_group_id: sys_health

number:
  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40079
    register_type: holding
    value_type: U_WORD
    name: "battery_charge_limit"
    unit_of_measurement: "%"
    device_class: battery
    step: 0.1
    min_value: 10.0
    max_value: 100.0
    icon: mdi:battery-charging-high
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    # Careful, values are inverted due to negative exponent
    lambda: "return x * id(mult_SoC);"
    write_lambda: "return x * id(div_SoC);"
    web_server:
      sorting_group_id: tunables

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    address: 40080
    register_type: holding
    value_type: U_WORD
    name: "battery_discharge_limit"
    unit_of_measurement: "%"
    device_class: battery
    step: 0.1
    min_value: 10.0
    max_value: 100.0
    icon: mdi:battery-charging-low
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    # Careful, values are inverted due to negative exponent
    lambda: "return x * id(mult_SoC);"
    write_lambda: "return x * id(div_SoC);"
    web_server:
      sorting_group_id: tunables

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_communication_error"
    register_type: holding
    address: 40097  # low bits 0-15
    bitmask: 0x0001  # documentation says bit 0
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_over_temp_alarm"
    register_type: holding
    address: 40097  # low bits 0-15
    bitmask: 0x0002  # documentation says bit 1
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_under_temp_alarm"
    register_type: holding
    address: 40097  # low bits 0-15
    bitmask: 0x0008  # documentation says bit 3
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_over_charge_current_alarm"
    register_type: holding
    address: 40097  # low bits 0-15
    bitmask: 0x0020  # documentation says bit 5
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_over_discharge_current_alarm"
    register_type: holding
    address: 40097  # low bits 0-15
    bitmask: 0x0080  # documentation says bit 7
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_over_voltage_alarm"
    register_type: holding
    address: 40097  # low bits 0-15
    bitmask: 0x0200  # documentation says bit 9
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_under_voltage_alarm"
    register_type: holding
    address: 40097  # low bits 0-15
    bitmask: 0x0800  # documentation says bit 11
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts

  - platform: modbus_controller
    modbus_controller_id: elt12k_modbus
    name: "battery_event_ground_fault"
    register_type: holding
    address: 40096  # high bits 16-31
    bitmask: 0x040  # documentation says bit 22, translated to 6
    icon: "mdi:alert-circle-outline"
    skip_updates: ${MODBUS_SKIP_TICKS_SLOW}
    web_server:
      sorting_group_id: alerts
