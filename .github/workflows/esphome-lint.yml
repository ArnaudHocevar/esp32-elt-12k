---
name: esphome-lint.yml

on:
  push:
    branches:
      - main
    paths:
      - '**.yaml'
      - '**.cpp'
      - '**.h'
  pull_request:
    branches:
      - main
    paths:
      - '**.yaml'
      - '**.cpp'
      - '**.h'

jobs:
  validate-config:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/esphome/esphome:2026.8.2

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Prepare secrets file from template
        run: |
          echo "=== Generating secrets.yaml from template ==="
          cp secrets.yaml.template secrets.yaml

      - name: Run Validation Checks on ESP32-C6 YAML
        run: |
          esphome config esp32-c6-elt-12k.yaml
      - name: Run Validation Checks on ESP32-S3 YAML
        run: |
          esphome config esp32-s3-elt-12k.yaml
