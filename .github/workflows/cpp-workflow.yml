---
name: cpp-workflow.yml

on:
  push:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.h'
      - '.clang-tidy'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp-workflow.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.h'
      - '.clang-tidy'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp-workflow.yml'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint C++ with Clang-Tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install Build and Lint Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-tools doctest-dev

      - name: Set up official ReviewDog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Cache CMake Build Directory
        id: cache-cmake
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Generate Compilation Database
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy and pipe to ReviewDog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run-clang-tidy -p build -j 2 ".*components/.*|.*tests/.*" > clang-tidy.log 2>&1 || true
          cat clang-tidy.log | reviewdog \
              -efm="%f:%l:%c: %trror: %m" \
              -efm="%f:%l:%c: %twarning: %m" \
              -efm="%f:%l: %trror: %m" \
              -efm="%f:%l: %twarning: %m" \
              -name="clang-tidy" \
              -reporter="github-pr-review" \
              -filter-mode="added" \
              -fail-level="error"

  test:
    name: Build & Run C++ Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install Build & Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doctest-dev ccache lcov

      - name: Cache Ccache Data
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Restore Cache for Build Directory
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build C++ Test Binaries
        run: |
          ccache -z # Zero the ccache stats before starting the build
          cmake --build build --config Debug
          ccache -s # Print out the stats at the end (shows hit vs miss ratio)

      - name: Housekeeping for Ccache
        run: ccache -c

      - name: Run C++ Test Suite (CTest)
        run: |
          mkdir -p build/test-results
          ctest --test-dir build --output-junit test-results/junit.xml --output-on-failure

      - name: Capture Coverage Metrics
        run: |
          lcov --directory build --capture --output-file build/coverage.info
          lcov --remove build/coverage.info '/usr/*' '*/tests/*' '*/.esphome/*' --output-file build/coverage.info
          lcov --list build/coverage.info

      - name: Upload Results to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'build/test-results/*.xml'
          check_name: 'C++ Unit Test Results'
          fail_on_failure: true
          require_tests: true
          comment: true
