---
name: Compile ESPHome Firmware Binaries

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'esp32-c6-elt-12k.yaml'
      - 'esp32-s3-elt-12k.yaml'
      - 'common/*.yaml'
      - 'docs/manifest.json'

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ESPHome Compiler Suite
        run: |
          pip install esphome
      - name: Prepare secrets file from template
        run: |
          echo "=== Generating secrets.yaml from template ==="
          cp secrets.yaml.template secrets.yaml

      - name: Compile ESP32-C6 Factory Binary
        run: |
          esphome compile esp32-c6-elt-12k.yaml
          mkdir -p docs/binaries
          cp .esphome/build/project-esp32c6/.pioenvs/project-esp32c6/firmware.factory.bin docs/binaries/esp32-c6-elt-12k.bin

      - name: Compile ESP32-S3 Factory Binary
        run: |
          esphome compile esp32-s3-elt-12k.yaml
          mkdir -p docs/binaries
          cp .esphome/build/project-esp32c6/.pioenvs/project-esp32c6/firmware.factory.bin docs/binaries/esp32-s3-elt-12k.bin

      - name: Commit and Push Compiled Binary Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/binaries/*.bin
          git diff-index --quiet HEAD || (git commit -m "Automated firmware factory compilation [skip ci]" && git push)
