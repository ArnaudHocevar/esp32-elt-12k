---
name: Compile ESPHome Firmware Binaries

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'elt-12k.yaml'
      - 'docs/manifest.json'

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install ESPHome Compiler Suite
        run: |
          pip install esphome

      - name: Compile ESP32-C6 Factory Binary
        run: |
          esphome compile elt-12k.yaml
          mkdir -p docs/binaries
          cp .esphome/build/project-esp32c6/.pioenvs/project-esp32c6/firmware.factory.bin docs/binaries/esp32c6-elt12k.bin

      - name: Commit and Push Compiled Binary Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/binaries/*.bin
          git diff-index --quiet HEAD || (git commit -m "Automated firmware factory compilation [skip ci]" && git push)
