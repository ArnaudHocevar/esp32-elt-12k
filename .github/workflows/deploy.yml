---
name: Build ESPHome Firmware Binaries

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'esp32-c6-elt-12k.yaml'
      - 'esp32-s3-elt-12k.yaml'
      - 'common/*.yaml'
      - 'docs/manifest.json'

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - yaml: esp32-c6-elt-12k.yaml
            output: esp32-c6-elt-12k.bin
          - yaml: esp32-s3-elt-12k.yaml
            output: esp32-s3-elt-12k.bin
    container:
      image: ghcr.io/esphome/esphome:2026.8.2
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Prepare secrets file from template
        run: |
          cp secrets.yaml.template secrets.yaml

      - name: Compile factory binary
        run: |
          esphome compile ${{ matrix.config.yaml }}
          mkdir -p docs/binaries
          cp .esphome/build/esp32-elt-12k/.pioenvs/esp32-elt-12k/firmware.factory.bin docs/binaries/${{ matrix.config.output }}

      - name: Commit and Push Compiled Binary Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/binaries/${{ matrix.config.output }}
          git diff-index --quiet HEAD || (git commit -m "Automated firmware factory compilation (${{ matrix.config.output }}) [skip ci]" && git push)
