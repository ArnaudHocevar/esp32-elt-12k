<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPHome Web Installer</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .installer-card {
            background: #1e1e1e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        p {
            color: #a3a3a3;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        esp-web-install-button {
            display: block;
            margin: 1.5rem 0;
        }

        button[slot="activate"] {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[slot="activate"]:hover {
            background-color: #0369a1;
        }
    </style>
    <!-- Import ESP Web Tools Script Element -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>

<div class="installer-card">
    <h1>Firmware Installer</h1>
    <p>Connect your ESP32-C6 or Waveshare ESP32-S3 via a USB data cable, then select install to flash directly from your
        web browser.</p>

    <!-- Manifest points directly to the manifest file inside the same folder -->
    <esp-web-install-button manifest="manifest.json">
        <button slot="activate">Connect & Install</button>
    </esp-web-install-button>
</div>

</body>
</html>
