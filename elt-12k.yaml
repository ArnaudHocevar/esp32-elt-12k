esphome:
  name: elt-12k
  friendly_name: ELT-12K PCS

esp32:
  # ESP32-C6-WROOM-1 uses the ESP32-C6 chip; esp32-c6-devkitc-1 is the closest
  # supported board identifier for this module in ESPHome.
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

# Wi-Fi configuration with captive portal fallback
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ELT-12K Fallback"
    password: !secret ap_password

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# UART for RS485 (MAX485S) communication
uart:
  id: modbus_uart
  tx_pin: GPIO22
  rx_pin: GPIO23
  baud_rate: 19200
  data_bits: 8
  stop_bits: 1
  parity: NONE

# Modbus over RS485
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO21
